name: Update Wishlist Feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/update-feed.yml"
      - "package.json"
      - "scripts/update-feed.js"
      - "src/shared.js"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-wishlist-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build wishlist feed
        run: node scripts/update-feed.js

      - name: Commit feed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wishlist-ledger.json data/wishlist-ledger-meta.json docs/v2
          if git diff --cached --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Update wishlist feed"
            git pull --rebase origin main
            git push
          fi
