name: Update Wishlist Feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/update-feed.yml"
      - "package.json"
      - "scripts/update-feed.js"
      - "src/shared.js"
  schedule:
    - cron: "23 */5 * * *"

permissions:
  contents: write

concurrency:
  group: update-wishlist-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Random start delay (0–30 min)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 1800))

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build wishlist feed
        run: node scripts/update-feed.js

      - name: Commit feed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wishlist-ledger.json data/wishlist-ledger-meta.json docs/v2
          if git diff --cached --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Update wishlist feed"
            git pull --rebase origin main
            git push
          fi

      - name: Notify Telegram on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Steam Wishlist Rank: feed update FAILED

Workflow: ${{ github.workflow }}
Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
